# Runs the Swoop engine headless with the remote (TLS) API + web UI exposed.
#
#   docker compose -f docker/compose.yaml up -d --build
#   docker compose -f docker/compose.yaml logs -f
#
# The remote listener uses a self-signed certificate on first run (see /data/tls inside the
# volume); trust it once, or put a reverse proxy with a real certificate in front of it and set
# `SWOOP_NO_TLS=1` below only if that proxy terminates TLS itself.
services:
  swoop:
    build:
      context: ..
      dockerfile: Dockerfile
    image: swoop:latest
    container_name: swoop
    restart: unless-stopped
    ports:
      - "41780:41780"
    volumes:
      - swoop-data:/data
      - swoop-downloads:/downloads
    environment:
      SWOOP_DATA_DIR: /data
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "swoop", "status", "--socket", "/data/swoop.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  swoop-data:
  swoop-downloads:
