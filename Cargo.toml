[workspace]
resolver = "2"
members = [
    "crates/swoop-domain",
    "crates/swoop-runtime",
    "crates/swoop-store",
    "crates/swoop-engine-http",
    "crates/swoop-engine-ftp",
    "crates/swoop-engine-torrent",
    "crates/swoop-media",
    "crates/swoop-grabber",
    "crates/swoop-services",
    "crates/swoop-server",
    "crates/swoop-cli",
    "crates/swoop-ffi",
    "crates/swoop-testserver",
    "crates/swoop-automation",
    "crates/swoop-archive",
    "crates/swoop-update",
    "crates/swoop-plugins",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swoop-app/swoop"
authors = ["Swoop contributors"]

[workspace.dependencies]
# async + runtime
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures = "0.3"
async-trait = "0.1"
# networking
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "cookies", "socks", "gzip", "brotli", "json"] }
url = { version = "2.5", features = ["serde"] }
http = "1"
bytes = "1"
mime_guess = "2"
percent-encoding = "2"
# server
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "set-header"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
# data
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
# hashing
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
blake3 = "1"
hex = "0.4"
argon2 = "0.5"
rand = "0.8"
# misc
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
parking_lot = "0.12"
dashmap = "6"
regex = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
lol_html = "2"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
sysinfo = "0.33"
humansize = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "7"
rust-embed = "8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
semver = "1"
suppaftp = { version = "6", default-features = false, features = ["async-rustls"] }
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
uniffi = { version = "0.29" }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
