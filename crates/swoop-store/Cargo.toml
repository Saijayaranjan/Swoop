[package]
name = "swoop-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite persistence (WAL), migrations and crash recovery"

[dependencies]
swoop-domain = { path = "../swoop-domain" }
swoop-runtime = { path = "../swoop-runtime" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
# `open_in_memory()` is backed by a private temp directory so the WAL/reader/writer behaviour
# is identical to production; `tempfile` cleans it up on drop.
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
