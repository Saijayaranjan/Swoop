[package]
name = "swoop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `swoop` command line: CLI client, headless server, native messaging host"

[[bin]]
name = "swoop"
path = "src/main.rs"

[dependencies]
swoop-domain = { path = "../swoop-domain" }
swoop-runtime = { path = "../swoop-runtime" }
swoop-services = { path = "../swoop-services" }
swoop-server = { path = "../swoop-server" }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
humansize = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = "0.26"
directories = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = "0.1"
percent-encoding = { workspace = true }
qrcode = { version = "0.14", default-features = false }
bytes = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
